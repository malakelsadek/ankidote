<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ankidote</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ankidote">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#fff6f9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script src="theme.js"></script>
<style>
:root{--gold:#ffc800}
:root{--font:"Nunito",ui-rounded,"SF Pro Rounded","Avenir Next Rounded",-apple-system,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) var(--pat);color:var(--fg);font:500 17px/1.55 var(--font);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
.stem,.fbe,.hard,.prompt,.step,.tips{-webkit-user-select:text;user-select:text}
h1,h2{font-family:var(--font)}
.pt{font-size:34px;font-weight:900;line-height:1.1;letter-spacing:-.01em;margin:8px 0 4px}
.tag{color:var(--mut);margin:6px 0 0;font-size:22px;line-height:1.3;font-weight:700}
h2{font-size:24px;font-weight:800;margin:38px 0 14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 4px 0 var(--line)}
.card p{margin:0 0 14px;color:var(--mut);font-size:17px}
.card h2{margin-top:0}

/* chunky buttons */
button,.btn{font:800 16px/1 var(--font);letter-spacing:.06em;text-transform:uppercase;min-height:50px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--blue-d);box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .06s,box-shadow .06s}
button:active,.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--line)}
button:disabled{background:var(--line);border-color:var(--line);color:var(--mut);box-shadow:none;cursor:default;transform:none}
.p{background:var(--acc);border-color:var(--acc);color:var(--onacc);box-shadow:0 4px 0 var(--acc-d)}
.p:active{box-shadow:0 0 0 var(--acc-d)}
.row{display:flex;gap:12px;flex-wrap:wrap}

/* shell + sidebar */
.shell{display:flex;min-height:100vh}
nav{position:sticky;top:0;align-self:flex-start;height:100vh;width:248px;flex:none;display:flex;flex-direction:column;gap:6px;padding:max(24px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));border-right:2px solid var(--line);background:var(--bg);transition:width .2s}
nav.min{width:88px}
.brand{font-weight:900;font-size:30px;letter-spacing:-.02em;color:var(--acc);padding:4px 12px 26px;white-space:nowrap}
.nv{width:100%;justify-content:flex-start;gap:16px;padding:0 14px;min-height:52px;border:2px solid transparent;background:none;box-shadow:none;border-radius:14px;color:var(--mut);white-space:nowrap;font-size:15px}
.nv:active{transform:none;box-shadow:none}
.nv.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc-d)}
.nv svg{flex:none}
.nv[data-v=settings]{margin-top:auto}
.tog svg{transition:transform .2s}
nav.min .tog svg{transform:rotate(180deg)}
nav.min .nv{justify-content:center;padding:0}
nav.min .nv span{display:none}
nav.min .brand{text-align:center;padding-left:0;padding-right:0}
main{flex:1;min-width:0;padding:max(32px,env(safe-area-inset-top)) max(40px,env(safe-area-inset-right)) max(56px,env(safe-area-inset-bottom)) 40px}
.page{max-width:1000px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}

/* today */
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.hud{display:flex;gap:20px;align-items:center;padding-top:10px}
.hp{display:inline-flex;align-items:center;gap:7px;font-weight:900;font-size:30px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;background:var(--acc);color:var(--onacc);border-radius:22px;padding:26px 28px;box-shadow:0 5px 0 var(--acc-d)}
.hero .big{font-size:72px;font-weight:900;line-height:1;display:block}
.hero .lbl{font-size:20px;font-weight:800}
.hero .sub{font-size:17px;font-weight:700;opacity:.85;margin-top:6px}
.hero button{background:#fff;color:var(--acc-d);border-color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.hero button:active{box-shadow:none}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:30px 16px;justify-items:center;padding:8px 0}
.node{flex-direction:column;gap:12px;background:none;border:0;box-shadow:none;min-height:0;padding:0;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:800;font-size:19px;line-height:1.25;text-align:center;max-width:200px}
.node:active{transform:none;box-shadow:none}
.node .nm{display:block}
.node small{display:block;color:var(--mut);font-weight:700;font-size:16px;margin-top:3px}
.ring{position:relative;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ring::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.disc{position:relative;width:84px;height:84px;margin-bottom:6px;border-radius:50%;background:var(--acc);box-shadow:0 6px 0 var(--acc-d);display:grid;place-items:center;color:#fff;transition:transform .06s,box-shadow .06s}
.disc.done{background:var(--blue);box-shadow:0 6px 0 var(--blue-d)}
.disc svg{width:40px;height:40px;stroke-width:2.4}
.node:active .disc{transform:translateY(5px);box-shadow:0 1px 0 var(--acc-d)}
.node:active .disc.done{box-shadow:0 1px 0 var(--blue-d)}
.badge{position:absolute;right:-6px;bottom:2px;min-width:32px;height:32px;padding:0 7px;border-radius:16px;background:var(--gold);color:#5a4300;border:3px solid var(--bg);display:grid;place-items:center;font-size:17px;font-weight:900}

/* banners */
.banner{background:var(--badsoft);border:2px solid var(--bad);border-radius:16px;padding:12px 16px;margin:0 0 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:17px;font-weight:700}
.msg{background:var(--accsoft);border:2px solid var(--acc);border-radius:16px;padding:12px 16px;margin:0 0 18px;font-size:17px;font-weight:700;white-space:pre-wrap}
.msg.err{background:var(--badsoft);border-color:var(--bad)}

/* study */
.study{display:flex;flex-direction:column;min-height:calc(100vh - 100px)}
.sbar{display:flex;align-items:center;gap:16px;margin-bottom:30px}
.x{border:0;background:none;box-shadow:none;min-height:40px;width:40px;padding:0;color:var(--mut);border-radius:12px}
.x:active{transform:none;box-shadow:none}
.prog{flex:1;height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--acc);position:relative;min-width:16px;transition:width .3s}
.prog i::after{content:'';position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.4)}
.cnt{font-weight:800;color:var(--mut);font-size:16px;white-space:nowrap}
.kick{font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.kick::before{content:'';width:14px;height:14px;border-radius:50%;background:var(--blue)}
.qh{font-size:26px;font-weight:900;margin:0 0 14px}
.stem{font-size:21px;line-height:1.6;font-weight:600;margin:0 0 26px}
.opt{display:flex;justify-content:flex-start;gap:16px;align-items:center;width:100%;text-align:left;margin:0 0 14px;padding:14px 18px;min-height:60px;border-radius:16px;background:var(--card);color:var(--fg);text-transform:none;letter-spacing:0;font-size:19px;font-weight:700;line-height:1.35}
.opt span{flex:1;text-align:left}
.opt b{flex:none;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--mut)}
.opt:disabled{background:var(--card);color:var(--fg);border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.opt.ok{border-color:var(--blue);background:var(--bluesoft);box-shadow:0 4px 0 var(--blue);color:var(--blue-d)}
.opt.no{border-color:var(--bad);background:var(--badsoft);box-shadow:0 4px 0 var(--bad);color:var(--bad)}
.opt.ok b{border-color:var(--blue);color:var(--blue-d)}
.opt.no b{border-color:var(--bad);color:var(--bad)}
.kbd{display:none;color:var(--mut);font-size:14px;font-weight:700;text-align:center;margin:10px 0 0}
#after{margin-top:auto;position:sticky;bottom:12px;padding-top:24px}
.fb{padding:20px 22px;border-radius:20px;border:2px solid var(--blue);background:var(--bluesoft)}
.fb.no{border-color:var(--bad);background:var(--badsoft)}
.fbh{display:flex;align-items:center;gap:14px}
.fbi{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.fbi svg{width:24px;height:24px;stroke-width:3}
.fb.no .fbi{background:var(--bad)}
.fbh strong{display:block;font-size:22px;font-weight:900;color:var(--blue-d)}
.fb.no .fbh strong{color:var(--bad)}
.fbh small{display:block;font-size:17px;font-weight:700;color:var(--bad)}
.fbe{margin:12px 0 0;font-size:18px;font-weight:600;line-height:1.55}
.fb .row{margin-top:16px}
.fb .hint{margin:12px 0 0;font-size:15px;font-weight:700;color:var(--mut)}
.rate button{flex:1;min-height:56px}
.fb.ok .p{background:var(--blue);border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d);color:#fff}
.fb.no .p{background:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 var(--bad-d);color:#fff}
.fb.ok .p:active,.fb.no .p:active{box-shadow:none}

/* stats */
.grid{display:grid;gap:14px}
.tile{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);border-radius:18px;padding:16px 18px}
.ti{flex:none;display:grid;place-items:center}
.tt b{display:block;font-size:26px;font-weight:900;line-height:1.1}
.tt span{display:block;font-size:16px;font-weight:800;color:var(--mut)}
.tt small{display:block;font-size:15px;color:var(--mut);font-weight:600}
.sub2{margin:0 0 14px;color:var(--mut);font-size:16.5px;font-weight:600}
.sub2 b{color:var(--fg)}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:14px;font-size:16px;font-weight:700}
.legend u{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;text-decoration:none}
.legend em{font-style:normal;color:var(--mut);font-size:15px;font-weight:600;margin-left:4px}
.act{display:flex;align-items:flex-end;gap:5px;height:112px}
.act div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.act i{display:block;width:100%;min-height:0}
.act i.r{background:var(--blue)}
.act i.w{background:var(--bad);border-radius:5px 5px 0 0}
.act span{font-size:13px;color:var(--mut);font-weight:700;margin-top:6px;height:14px}
.act span.now{color:var(--acc);font-weight:900}
.wkr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:2px solid var(--line);font-weight:700}
.wkr:first-of-type{border-top:0}
.wkr small{grid-column:1/-1;color:var(--mut);font-size:14.5px;font-weight:600}
.meter{grid-column:1/-1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:5px}
.hard{padding:12px 0;border-top:2px solid var(--line);font-size:17px;font-weight:600}
.hard:first-of-type{border-top:0}
.hard small{color:var(--mut);display:block;font-weight:700}
.fc{display:flex;align-items:flex-end;gap:4px;height:124px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px}
.fc i{width:100%;background:var(--blue);border-radius:6px 6px 0 0;min-height:2px}
.fc span{font-size:13px;color:var(--mut);font-weight:700;height:14px}
.fc em{font-style:normal;font-size:14px;font-weight:800;color:var(--fg);height:16px}

/* guide */
.steps{display:flex;flex-direction:column;gap:18px}
.step{display:flex;gap:16px;align-items:flex-start}
.step>b{flex:none;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--onacc);box-shadow:0 3px 0 var(--acc-d);display:grid;place-items:center;font-size:15px;font-weight:900}
.step strong{display:block;font-weight:800}
.step p,.tips p{margin:2px 0 0;color:var(--mut);font-size:17px;font-weight:600}
.tips p{margin:0 0 10px}.tips p:last-child{margin:0}
.step p b,.tips b{color:var(--fg)}
.prompt{white-space:pre-wrap;font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:16px;margin:0 0 16px;max-height:320px;overflow:auto}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.chip{min-height:46px;padding:0 18px;font-size:16px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--fg)}
.chip.on{background:var(--accsoft);border-color:var(--acc);color:var(--acc-d);box-shadow:0 4px 0 var(--acc)}

/* settings */
.set{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-top:2px solid var(--line)}
.set:first-child{border-top:0}
.set strong{font-weight:800}
.set p{margin:2px 0 0;color:var(--mut);font-size:16px;font-weight:600}
.seg2{display:inline-flex;flex:none;padding:4px;gap:4px;border:2px solid var(--line);border-radius:18px;background:var(--bg)}
.seg2 button{border:0;box-shadow:none;background:none;min-height:42px;padding:0 18px;color:var(--mut);border-radius:14px;text-transform:none;letter-spacing:0;font-size:16px}
.seg2 button:active{transform:none}
.seg2 button.on{background:var(--acc);color:var(--onacc);box-shadow:0 3px 0 var(--acc-d)}
.tgl{appearance:none;-webkit-appearance:none;flex:none;width:58px;height:34px;border-radius:17px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;margin:0}
.tgl::after{content:'';position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .2s}
.tgl:checked{background:var(--acc)}
.tgl:checked::after{transform:translateX(24px)}

@media(hover:hover) and (pointer:fine){
.kbd{display:block}
.opt:hover:not(:disabled){border-color:var(--blue)}
.nv:hover:not(.on){background:var(--accsoft)}
}
@media(min-width:700px){
body{font-size:19px}
.pt{font-size:40px}
.hero .big{font-size:84px}
.card{padding:24px}
.qh{font-size:30px}
.stem{font-size:25px;line-height:1.6;margin-bottom:30px}
.opt{font-size:22px;padding:18px 22px;min-height:72px}
.opt b{width:36px;height:36px;font-size:15px}
.fbh strong{font-size:24px}
.fbe{font-size:20px}
.rate button{min-height:64px;font-size:18px}
}
@media(max-width:699px){
.shell{display:block}
nav{position:fixed;inset:auto 0 0 0;height:auto;width:auto;flex-direction:row;padding:6px 8px max(6px,env(safe-area-inset-bottom));border-top:2px solid var(--line);border-right:0;z-index:5}
.brand,.tog{display:none}
.nv[data-v=settings]{margin-top:0}
.nv{flex-direction:column;gap:2px;justify-content:center;min-height:54px;padding:0;font-size:11px;letter-spacing:.04em}
main{padding:24px 20px 100px}
.pt{font-size:30px}
.hero .big{font-size:60px}
#after{bottom:76px}
}

/* folders */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.folder{position:relative;display:flex;align-items:center;justify-content:flex-start;gap:18px;width:100%;min-height:112px;padding:18px 22px;border-radius:22px;background:var(--card);color:var(--fg);text-align:left;text-transform:none;letter-spacing:0;font-size:21px;font-weight:800;line-height:1.25}
.fic{flex:none;display:grid;place-items:center}
.ftx{flex:1;min-width:0}
.ftx .nm{display:block;overflow-wrap:anywhere}
.folder small{display:block;color:var(--mut);font-size:16px;font-weight:700;margin-top:2px}
.bar2{display:block;height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:12px}
.bar2 i{display:block;height:100%;background:var(--gold);border-radius:5px}
.badge2{position:absolute;top:-12px;right:-8px;min-width:36px;height:36px;padding:0 9px;border-radius:18px;background:var(--gold);color:#5a4300;border:3px solid var(--bg);display:grid;place-items:center;font-size:17px;font-weight:900}
.crumb{min-height:44px;padding:0 16px 0 8px;margin:0 0 8px;border:0;box-shadow:none;background:none;color:var(--blue-d);font-size:15px}
.crumb:active{transform:none;box-shadow:none}
.crumb svg{width:22px;height:22px}
/* palettes */
.pals{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pal{flex-direction:column;gap:12px;min-height:104px;text-transform:none;letter-spacing:0;font-size:18px;color:var(--fg)}
.pal .dots{display:flex}
.pal .dots i{width:32px;height:32px;border-radius:50%;border:3px solid var(--card)}
.pal .dots i+i{margin-left:-10px}
.pal.on{border-color:var(--acc);background:var(--accsoft);box-shadow:0 4px 0 var(--acc)}
.bigf{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.bf{position:relative;flex-direction:column;gap:6px;min-height:300px;padding:34px 22px 26px;border-radius:26px;background:var(--card);color:var(--fg);text-align:center;text-transform:none;letter-spacing:0;font-size:25px;font-weight:900;line-height:1.2}
.bf svg{margin-bottom:10px}
.bf .nm{display:block;overflow-wrap:anywhere}
.bf small{display:block;color:var(--mut);font-size:17px;font-weight:700}
.bf .bar2{width:100%;max-width:200px;margin-top:14px}
.bf .badge2{top:-14px;right:-10px}
/* decks inside a folder: look like stacks of cards */
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:34px 30px;padding:4px 14px 20px 0}
.deckcard{flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;min-height:200px;padding:22px;border-radius:20px;background:var(--card);color:var(--fg);text-align:left;text-transform:none;letter-spacing:0;font-weight:800;box-shadow:0 4px 0 var(--line),7px 8px 0 -2px var(--card),7px 8px 0 0 var(--line),14px 16px 0 -2px var(--card),14px 16px 0 0 var(--line)}
.deckcard:active{transform:translateY(4px);box-shadow:0 0 0 var(--line),7px 8px 0 -2px var(--card),7px 8px 0 0 var(--line),14px 16px 0 -2px var(--card),14px 16px 0 0 var(--line)}
.deckcard .dn{display:block;font-size:23px;line-height:1.25;font-weight:900;overflow-wrap:anywhere}
.deckcard .dm{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.deckcard small{color:var(--mut);font-size:17px;font-weight:700}
.deckcard .due{background:var(--acc);color:var(--onacc);border-radius:12px;padding:3px 12px;font-size:16px;font-weight:900}
.deckcard .due.done{background:var(--bluesoft);color:var(--blue-d)}
.deckcard .bar2{margin-top:auto}
.deckcard .go{align-self:flex-end;color:var(--blue-d);font-size:16px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
@media(min-width:700px){.tag{font-size:26px}.hp{font-size:34px}}
.deckcard .fl{display:block;font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--blue-d);margin-bottom:-6px}
.set.col{flex-direction:column;align-items:stretch;gap:16px}
.set.col .pals{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
/* plus buttons, add tiles, dialogs */
.plus{width:58px;height:58px;padding:0;border-radius:50%;flex:none;margin-top:6px}
.addtile{flex-direction:column;gap:10px;min-height:200px;border:3px dashed var(--line);box-shadow:none;background:transparent;color:var(--mut);border-radius:20px;text-transform:none;letter-spacing:0;font-size:19px}
.addtile:active{transform:none;box-shadow:none;border-color:var(--acc);color:var(--acc)}
.bigf .addtile{min-height:300px;border-radius:26px;font-size:21px}
.deckcard .fl{display:flex;align-items:center;gap:6px}
.ovl{position:fixed;inset:0;background:rgba(20,10,16,.5);display:grid;place-items:center;padding:20px;z-index:50}
.sheet{width:min(500px,100%);background:var(--card);border:2px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 6px 0 var(--line)}
.sheet h2{margin:0 0 6px}
.sheet p{margin:0 0 18px;color:var(--mut);font-size:17px;font-weight:600}
.sheet .err{margin:14px 0 0;color:var(--bad);font-weight:700;min-height:0}
.sheet .err:empty{display:none}
.inp{display:block;width:100%;font:700 18px var(--font);padding:14px 16px;margin:0 0 16px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);-webkit-user-select:text;user-select:text;outline:none}
.inp:focus{border-color:var(--acc)}
.inp[hidden]{display:none}
.row.end{justify-content:flex-end}
.set .inp{width:auto;min-width:190px;margin:0;flex:none}
/* ---- phone layout (iPhone). Kept last so it overrides the earlier rules ---- */
.nv.more{display:none}
.morelist{display:grid;gap:16px}
.morerow{justify-content:flex-start;gap:16px;width:100%;min-height:84px;padding:14px 18px;border-radius:20px;background:var(--card);color:var(--fg);text-align:left;text-transform:none;letter-spacing:0}
.morerow .mi{flex:none;display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--accsoft);color:var(--acc-d)}
.morerow .mt{flex:1;min-width:0}
.morerow b{display:block;font-size:20px;font-weight:900}
.morerow small{display:block;color:var(--mut);font-size:15px;font-weight:700;line-height:1.3;margin-top:2px}
.morerow .chv{font-size:30px;color:var(--mut);font-weight:700}
@media(max-width:699px){
body{font-size:17px}
nav{padding:6px 6px max(6px,env(safe-area-inset-bottom));gap:2px}
.nv{flex:1;min-width:0;min-height:56px;font-size:11px;letter-spacing:.03em;border-radius:12px;gap:3px;padding:0 2px}
.nv.wo{display:none}
.nv.more{display:inline-flex}
.nv svg{width:24px;height:24px}
main{padding:max(18px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(94px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.pt{font-size:30px}
.tag{font-size:18px}
h2{font-size:22px;margin:30px 0 12px}
.toprow{margin-bottom:16px}
.hp{font-size:26px}
.hp svg{width:34px;height:34px}
.plus{width:52px;height:52px}
.hero{padding:20px;gap:16px}
.hero .big{font-size:60px}
.hero button{width:100%}
.folders{grid-template-columns:1fr;gap:18px}
.folder{min-height:96px;padding:16px 18px}
.bigf{grid-template-columns:repeat(2,1fr);gap:20px 14px}
.bf{min-height:230px;padding:26px 10px 20px;font-size:20px}
.bf svg{width:92px;height:92px}
.bf small{font-size:15px}
.bigf .addtile{min-height:230px}
.deckgrid{grid-template-columns:1fr;gap:26px;padding-right:14px}
.deckcard{min-height:170px;padding:18px}
.deckcard .dn{font-size:21px}
.two{grid-template-columns:1fr}
.card{padding:18px}
.grid{grid-template-columns:1fr 1fr!important}
.tile{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
.set{flex-wrap:wrap;gap:14px}
.set .inp{width:100%}
.pals{grid-template-columns:1fr 1fr!important}
.seg2{width:100%}
.seg2 button{flex:1}
.ovl{place-items:end stretch;padding:0}
.sheet{width:100%;border-radius:24px 24px 0 0;padding-bottom:max(26px,env(safe-area-inset-bottom))}
.study{min-height:calc(100vh - 60px)}
.sbar{margin-bottom:22px}
.qh{font-size:24px}
.stem{font-size:20px;margin-bottom:20px}
.opt{padding:14px;min-height:62px;font-size:18px;gap:12px}
.fb{padding:16px}
.fbh strong{font-size:21px}
.fbe{font-size:17px}
.rate button{min-height:54px;font-size:15px;padding:0 8px}
#after{bottom:10px}
.kbd{display:none!important}
body.studying nav{display:none}
body.studying main{padding-bottom:24px}
}
@supports(height:100dvh){@media(max-width:699px){.study{min-height:calc(100dvh - 60px)}}}
/* stats */
.stats{display:grid;gap:16px}
.stats .card{margin:0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px 14px;flex-wrap:wrap;margin-bottom:14px}
.ch h3{margin:0;font-size:22px;font-weight:900}
.big2{font-weight:900;font-size:18px;color:var(--mut)}
.chip2{display:inline-block;margin-left:8px;border-radius:10px;padding:1px 10px;font-size:15px;font-weight:900}
.chip2.up{background:var(--bluesoft);color:var(--blue-d)}
.chip2.dn{background:var(--badsoft);color:var(--bad)}
.fine{margin:12px 0 0;font-size:15px;color:var(--mut);font-weight:600}
.stats .grid{grid-template-columns:repeat(4,1fr)}
.empty{text-align:center;padding:36px 20px}
.empty .ei{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--accsoft);color:var(--acc-d);margin-bottom:14px}
.empty h3{margin:0 0 6px;font-size:24px;font-weight:900}
.empty p{margin:0;color:var(--mut);font-size:17px}
@media(max-width:699px){
.toprow{flex-wrap:nowrap}
.toprow>div:first-child{min-width:0}
.stats .grid{grid-template-columns:1fr 1fr}
.ch h3{font-size:20px}
}
@media(min-width:700px) and (max-width:1050px){.stats .grid{grid-template-columns:1fr 1fr}}
.qlbl{margin:6px 0 10px!important;color:var(--fg)!important;font-weight:800;font-size:17px!important}
.qrow{align-items:center}
.inp.qi{width:130px;margin:0;padding:10px 14px;font-size:17px}
</style>
</head>
<body>
<div class="shell"><nav id="nav"></nav><main id="app"></main></div>
<script src="app.js"></script>
</body>
</html>
